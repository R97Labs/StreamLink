<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>

<body class="popup-body">
  <div class="label">Default Player</div>
  <div class="radio-group">
    <label>
      <input type="radio" name="player" value="browser">
      <span>StreamLink Website</span>
    </label>
    <label>
      <input type="radio" name="player" value="extension">
      <span>Extension Player</span>
    </label>
    <label>
      <input type="radio" name="player" value="iina">
      <span>IINA Player</span>
    </label>
  </div>

  <div class="account-section">
    <div class="label">Account</div>
    <a href="https://streamlink.cloud/" target="_blank" class="dashboard-link">
      🚀 Open Dashboard
    </a>
    <div id="user-status" class="status-text">Checking status...</div>
  </div>

  <div class="footer">
    <a href="https://ko-fi.com/r97labs" target="_blank">☕ Support</a>
    <a href="https://github.com/R97Labs" target="_blank">GitHub</a>
  </div>
  <script src="pop.js"></script>
</body>

</html>
