<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StreamLink Theater Mode</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000000; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .theater-container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    .theater-container:focus { outline: none; }
    
    /* Clickable video layer wrapper */
    .video-wrapper {
      width: 100%; height: 100%; cursor: pointer;
    }
    video { width: 100%; height: 100%; object-fit: contain; background: #000000; }
    
    .player-overlay {
      position: absolute; left: 0; width: 100%; box-sizing: border-box;
      z-index: 10; transition: opacity 0.3s ease, visibility 0.3s ease; opacity: 1; visibility: visible;
      pointer-events: none; /* Allows clicks to pass through to wrapper where needed */
    }
    .top-header {
      top: 0; padding: 30px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
      color: white; font-size: 18px; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: auto;
    }
    .bottom-controls {
      bottom: 0; padding: 30px 40px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
      pointer-events: auto;
    }
    
    /* Timeline Module */
    .timeline-container {
      display: flex; align-items: center; gap: 15px; margin-bottom: 20px;
    }
    .timeline-rail {
      flex-grow: 1; height: 6px; background: rgba(255,255,255,0.2);
      border-radius: 3px; cursor: pointer; position: relative; transition: transform 0.1s ease;
    }
    .timeline-rail:hover { transform: scaleY(1.3); }
    .timeline-buffer {
      position: absolute; top: 0; left: 0; height: 100%; width: 0%;
      background: rgba(255, 255, 255, 0.35); border-radius: 3px; pointer-events: none;
    }
    .timeline-fill {
      position: absolute; top: 0; left: 0; height: 100%; width: 0%;
      background: #0a84ff; border-radius: 3px; pointer-events: none;
    }
    .time-display {
      color: rgba(255,255,255,0.8); font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 500; min-width: 45px;
    }

    /* Controls Layout */
    .controls-row { display: flex; justify-content: space-between; align-items: center; }
    .controls-left, .controls-right { display: flex; align-items: center; gap: 18px; }
    
    .btn-action {
      background: transparent; border: none; color: white;
      cursor: pointer; transition: transform 0.1s ease;
      display: flex; align-items: center; justify-content: center; padding: 6px;
    }
    .btn-action:hover { transform: scale(1.12); }
    .btn-action svg { fill: currentColor; width: 22px; height: 22px; transition: color 0.1s ease; }
    .btn-action:hover svg { color: #0a84ff; }
    
    /* Volume Housing */
    .volume-container { display: flex; align-items: center; gap: 10px; }
    .volume-slider {
      width: 0; height: 4px; -webkit-appearance: none; appearance: none;
      background: rgba(255,255,255,0.3); border-radius: 2px; outline: none;
      transition: width 0.2s ease, opacity 0.2s ease; opacity: 0; cursor: pointer;
    }
    .volume-container:hover .volume-slider, .volume-slider:focus { width: 80px; opacity: 1; }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: #ffffff; transition: background 0.1s;
    }
    .volume-slider::-webkit-slider-thumb:hover { background: #0a84ff; }

    .exit-theater-btn { 
      background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255,255,255,0.2); 
      color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; 
      font-size: 14px; font-weight: 600; backdrop-filter: blur(5px); transition: all 0.2s ease; 
    }
    .exit-theater-btn:hover { background: #ff3b30; border-color: #ff3b30; }
    
    .hide-ui { opacity: 0 !important; visibility: hidden !important; cursor: none !important; }
  </style>
</head>
<body>

  <div class="theater-container" id="container" tabindex="0">
    <div class="player-overlay top-header" id="header">
      <span>🍿 Now Streaming via StreamLink</span>
      <button id="exit-btn" class="exit-theater-btn">✕ Close Player</button>
    </div>

    <div class="video-wrapper" id="video-wrapper">
      <video id="video-element" autoplay playsinline></video>
    </div>

    <div class="player-overlay bottom-controls" id="controls">
      <div class="timeline-container">
        <span class="time-display" id="current-time">0:00</span>
        <div class="timeline-rail" id="timeline">
          <div class="timeline-buffer" id="buffer-progress"></div>
          <div class="timeline-fill" id="progress"></div>
        </div>
        <span class="time-display" id="total-time">-:-</span>
      </div>

      <div class="controls-row">
        <div class="controls-left">
          <button class="btn-action" id="play-btn" title="Play/Pause (Space)">
            <svg id="play-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          
          <button class="btn-action" id="rewind-btn" title="Rewind 10s (←)">
            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
          </button>
          
          <button class="btn-action" id="forward-btn" title="Forward 10s (→)">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
          </button>
          
          <div class="volume-container">
            <button class="btn-action" id="volume-btn" title="Mute/Unmute (M)">
              <svg id="volume-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1">
          </div>
        </div>

        <div class="controls-right">
          <button class="btn-action" id="fs-btn" title="Fullscreen (F)">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
